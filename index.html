<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Ops+One&family=Sedgwick+Ave&family=Sedgwick+Ave+Display&family=New+Rocker&family=Permanent+Marker&family=Urbanist:wght@450;650&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: the room fills the screen. The logo sits top left with one quiet line under it; one plain text row at the bottom picks where you stand. No panels, no boxes. */
  --backdrop:#0b0c0f;
  --backdrop-edge:#050506;
  --ink:#f6f7f9;
  --ink-soft:rgba(246,247,249,.62);
  --ink-faint:rgba(246,247,249,.4);
  --accent:#2a7bff;
  --accent-deep:#0a2460;
  --display:"New Rocker","Pirata One",Georgia,serif;
  --body:"Urbanist","Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--backdrop-edge);color:var(--ink);
  font-family:var(--body);font-weight:450;font-size:17px;line-height:1.3;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.stage{
  position:relative;height:100%;touch-action:none;cursor:grab;
  background:radial-gradient(ellipse 75% 62% at 50% 44%,var(--backdrop) 0%,var(--backdrop-edge) 100%);
}
.stage:active{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.logo{
  position:absolute;left:18px;top:12px;margin:0;pointer-events:none;
  font-family:var(--display);font-weight:400;font-size:clamp(30px,8.4vw,46px);line-height:1;letter-spacing:.01em;
  color:var(--ink);-webkit-text-stroke:6px var(--accent);paint-order:stroke fill;
  text-shadow:0 3px 0 var(--accent-deep),0 7px 12px rgba(0,0,0,.35);
}
.shade{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;background:linear-gradient(to bottom,rgba(5,5,6,.7),rgba(5,5,6,0))}
.sub{position:absolute;left:20px;top:calc(12px + clamp(30px,8.4vw,46px) + 12px);margin:0;color:var(--ink-soft);font-size:15px;pointer-events:none}
.hint{position:absolute;right:18px;top:22px;margin:0;color:var(--ink-soft);font-size:15px;pointer-events:none;transition:opacity .3s}

.picks{
  position:absolute;left:0;right:0;bottom:0;display:grid;gap:14px;
  padding:34px 18px max(20px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(5,5,6,.82),rgba(5,5,6,0));
}
.row{display:flex;align-items:baseline;gap:6px 22px;flex-wrap:wrap}
.row > span{flex:0 0 56px;color:var(--ink-faint);font-size:14px;letter-spacing:.02em}
.opt{
  appearance:none;border:0;background:none;padding:6px 0 7px;margin:0;cursor:pointer;
  font:450 19px/1.1 var(--body);letter-spacing:-.01em;color:var(--ink-soft);
  border-bottom:2px solid transparent;
}
.opt[aria-checked="true"]{color:var(--ink);font-weight:650;border-bottom-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}
.note{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;font-size:19px;background:var(--backdrop-edge)}
.note[hidden]{display:none}
.note small{display:block;margin-top:16px;max-width:36ch;font-size:13px;line-height:1.35;color:var(--ink-faint);word-break:break-word}

@media (min-width:760px){
  .picks{display:flex;flex-wrap:wrap;gap:10px 40px;padding-left:28px;padding-bottom:26px}
  .row{flex-wrap:nowrap;white-space:nowrap}
  .logo{left:28px;top:18px}
  .sub{left:30px;top:calc(18px + 46px + 12px)}
  .hint{right:28px;top:30px}
}
@media (max-width:480px){.row{gap:0 18px}.row > span{display:none}.opt{padding:13px 0 12px}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="3D view of the Silverback street. Drag to look around.">
  <canvas id="view"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <h1 class="logo">Silverback</h1>
  <p class="sub">The street · play it on a Quest</p>
  <p class="hint" id="hint">Drag to look around</p>

  <nav class="picks" aria-label="Where you stand">
    <div class="row" role="radiogroup" aria-labelledby="l-spot" id="g-spot">
      <span id="l-spot">View</span>
      <button class="opt" role="radio" aria-checked="true" data-spot="street">Street</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="shop">Shop</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="booths">Booths</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="champs">Champions</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="yard">Practice</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="hoop">Hoop</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="roof">Roof</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="mouth">Alley</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="back">Elevator</button>
      <button class="opt" role="radio" aria-checked="false" data-spot="dock">Dock</button>
    </div>
  </nav>
  <div class="note" id="note" hidden></div>
</main>

  var at = standAt(s);

  camera.updateMatrixWorld(); camera.updateProjectionMatrix();

var drag = { id: null, x: 0, y: 0 };
stage.addEventListener('pointerdown', function (e) {

  drag.id = e.pointerId; drag.x = e.clientX; drag.y = e.clientY; $('hint').style.opacity = 0;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});

  view.yaw += (e.clientX - drag.x) * k; view.pitch = Math.max(-1.3, Math.min(1.3, view.pitch + (e.clientY - drag.y) * k));
  drag.x = e.clientX; drag.y = e.clientY;

stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
$('g-spot').addEventListener('click', function (e) { var b = e.target.closest('[data-spot]'); if (b) goTo(b.dataset.spot); });

function resize() {

  aspect = w / h; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(w, h, false);

if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

/* tired lamps flicker */
var flicks = [];
function flicker(dt) {
  flicks.forEach(function (f) {
    f.left -= dt;
    if (f.left <= 0) {
      var r = Math.random();
      f.level = r < 0.8 ? 1 : r < 0.92 ? 0.5 : 0.15;
      f.left = f.level === 1 ? 0.3 + Math.random() * 2.2 : 0.04 + Math.random() * 0.1;

  });
}

var clock = 0, live = false;
function tick(dt, xrFrame) {
  clock += dt;
  if (live && !reduceMotion) flicker(dt);
  fighters.forEach(function (f) {
    poseFighter(f, clock);
    if (!reduceMotion) f.torso.scale.set(1 + Math.sin(clock * 1.3 + f.phase) * 0.005, 1, 1 + Math.sin(clock * 1.3 + f.phase) * 0.01);
  });
  if (typeof XRG !== 'undefined' && XRG.on) { xrFrameTick(dt, xrFrame); return; }      /* in a headset: you are the camera */

/* Anything that went wrong but did not stop the page is shown in small print under the title, so a screenshot says what to fix. */
function report() {

  var count = {}, list = [];
  PROBLEMS.forEach(function (p) { if (count[p]) count[p]++; else { count[p] = 1; list.push(p); } });
  var text = list.map(function (p) { return count[p] > 1 ? p + ' (' + count[p] + ' times)' : p; }).join('; ').slice(0, 260);
  var el = document.querySelector('.sub'); if (el) el.textContent = SCENE.sub + ' · ' + BUILD + ' · missing: ' + text;
}
function fail(e, where) {
  var box = document.createElement('div'), d = document.createElement('small');
  box.textContent = 'The ' + SCENE.what + ' did not load. Reload the page to try again.';
  d.textContent = BUILD + ' · ' + where + ': ' + String(e && (e.message || e)).slice(0, 240);
  box.appendChild(d); $('note').textContent = ''; $('note').appendChild(box); $('note').hidden = false;

/* Shaders the graphics chip refused. The room's shader has a plainer version to fall back to. */
function refused() {

    var d = p.diagnostics; if (!d || d.runnable !== false) return;
    bad.push({ full: String(p.cacheKey || '').indexOf('dFdx(uv)') >= 0,                   /* the room's full shader, which has a plainer stand-in */
      log: ((d.fragmentShader && d.fragmentShader.log) || (d.vertexShader && d.vertexShader.log) || d.programLog || 'no log').replace(/\s+/g, ' ') });
  });

}
function start() {
  renderer.setClearColor(SCENE.sky === undefined ? 0x040404 : SCENE.sky, 1);       /* indoors: near black. A scene under the open sky names its own colour */
  var world = new T.Group(), specs = []; scene.add(world);
  function step(name, fn) { try { fn(); } catch (e) { problem(name, e); } }
  step('textures', buildTextures);
  specs = SCENE.build(world, step) || [];               /* the scene builds its rooms and says where the gorillas go */
  specs.forEach(function (s, i) {
    step('gorilla ' + (i + 1), function () {
      useLights(s.set || ARENA_LIGHTS);
      var f = makeFighter(s.pos, s.yaw, s.pose, s.least, s.look); world.add(f.root); fighters.push(f);
      if (s.tag) TAGGED[s.tag] = f;

  resize(); goTo(named in SCENE.spots ? named : SCENE.first);
  if (window.__manual) { window.__arena = { tick: tick, goTo: goTo, view: view, spots: SCENE.spots, V: V, problems: PROBLEMS, refused: refused }; tick(0.016); report(); return; }
  live = true;

    var dt = Math.min(0.05, Math.max(0, (ms - last) / 1000) || 0.016); last = ms;
    try { tick(dt, xrFrame); } catch (e) {

}
function fontsReady() {                                  /* the signs are drawn with web fonts, so wait for them, but not for long */
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  var wait = Promise.all(['400 64px "New Rocker"', '400 64px "Permanent Marker"', '400 64px "Black Ops One"', '400 64px "Anton"', '400 64px "Sedgwick Ave Display"', '400 64px "Sedgwick Ave"', '650 32px "Urbanist"'].map(function (f) { return document.fonts.load(f).catch(function () {}); }));

/* The gorilla's data is inside this page, so there is no second download that can fail. The separate file is only a fallback. */
function loadFighter() {
  var el = document.getElementById('fighter-data');

}
function quietly(fn) { try { return Promise.resolve(fn()); } catch (e) { return Promise.reject(e); } }
Promise.all([quietly(loadFighter).catch(function (e) { throw new Error('the gorilla: ' + (e && e.message)); }), quietly(fontsReady).catch(function () {})]).then(function (res) {
  DATA = res[0];

})();
